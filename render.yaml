# Blueprint per provare l'app senza AWS e senza spendere nulla: due servizi
# Render. I siti statici non hanno un piano da scegliere (sono sempre
# gratuiti): solo wardrobe-api, un web service vero, è sul piano free.
#
#   wardrobe-api  — l'API in modalità DEV_MODE: armadio demo in memoria (12
#                   capi seminati), niente Postgres, niente S3. Basta per
#                   provare i suggerimenti e la chat vera con un modello reale.
#   wardrobe-web  — l'app esportata come sito statico (Expo web), che parla
#                   con wardrobe-api tramite EXPO_PUBLIC_API_URL.
#
# Limiti di questa modalità — del test gratuito, non del prodotto:
#  - i dati (chat, capi aggiunti) si perdono a ogni riavvio: il piano free di
#    Render sospende il servizio dopo un periodo di inattività;
#  - il caricamento foto da questo deploy non funziona: in DEV_MODE l'URL di
#    upload che l'API restituisce punta a se stessa in locale
#    (`ArchivioInMemoria.url_upload`, pensato per `npm run dev` sulla stessa
#    macchina), non al dominio pubblico di Render. Per provare la chat non
#    serve: i capi demo ci sono già.
#
# Uso: su dashboard.render.com, «New» → «Blueprint» → collega questo repo.
# Render chiede le chiavi segnate `sync: false` durante il primo deploy.
# `EXPO_PUBLIC_API_URL` va incollato a mano con l'URL di wardrobe-api una
# volta che è online (prima di far partire — o rifare — il deploy del sito).

services:
  - type: web
    name: wardrobe-api
    runtime: python
    plan: free
    rootDir: services/api
    buildCommand: pip install uv && uv sync --all-extras
    startCommand: PORTA=$PORT uv run python -m handlers.local_server
    healthCheckPath: /salute
    envVars:
      - key: DEV_MODE
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  - type: static
    name: wardrobe-web
    rootDir: .
    buildCommand: npm ci && npm run build:web --workspace @wardrobe/mobile
    staticPublishPath: apps/mobile/dist
    envVars:
      # Incolla qui l'URL pubblico di wardrobe-api (https://wardrobe-api-xxxx.onrender.com)
      # dopo il suo primo deploy, poi rifai il deploy di questo servizio.
      - key: EXPO_PUBLIC_API_URL
        sync: false
