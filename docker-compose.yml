# Solo VPS: `api` e `caddy`. In sviluppo l'API gira con `uv run` e il database
# è lo stack locale di Supabase (`npm run supabase:start`), non un container di
# questo file.
#
# Il Postgres e le foto di prima (ADR 0010) non sono più qui, ma sul VPS i loro
# volumi restano: `postgres_data` e `foto_dati` sono la sola copia di riserva,
# ferma al giorno del passaggio. Nessuno lancia `down -v`, e toglierli è una
# decisione dell'utente.
#
# La copia sono i volumi, non il container. `wardrobe-postgres`, che il deploy
# non tocca (niente `--remove-orphans`), resterebbe acceso sulla stessa rete di
# `api` con i dati di tutti: il giorno del passaggio, dopo lo script di
# migrazione, si ferma con `docker stop` — il volume resta — e lo decide
# l'utente (`docs/PROGRESS.md`).
services:
  # Le chiavi dei provider (ANTHROPIC_API_KEY, FAL_KEY, …) vengono da
  # services/api/.env — mai da questo file, che è versionato. I due valori di
  # Supabase invece stanno qui apposta: sono **pubblici** per costruzione
  # (l'indirizzo del progetto e la chiave che finisce anche nell'app), e chi
  # è l'utente lo dice il suo token, non loro. `environment:` vince su
  # `env_file:` in Compose, quindi un .env vecchio non può puntare l'API a un
  # altro progetto.
  api:
    build:
      context: ./services/api
    container_name: wardrobe-api
    restart: unless-stopped
    env_file:
      - ./services/api/.env
    environment:
      SUPABASE_URL: "https://lmjsrhwzjxubecgctrmd.supabase.co"
      SUPABASE_CHIAVE_PUBBLICA: "sb_publishable_f0lDKgDE9tkbqmgeVXT3Sw_kQn7CxFD"
      PORTA: "8787"
    # Niente `ports:` qui: l'unico ingresso pubblico è Caddy, in HTTPS.
    # Pubblicare anche questa porta permetterebbe di bypassare TLS parlando
    # in chiaro direttamente alla porta 8787.
    expose:
      - "8787"

  # Il dominio vero va scritto in ./Caddyfile prima del primo avvio.
  caddy:
    image: caddy:2-alpine
    container_name: wardrobe-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
