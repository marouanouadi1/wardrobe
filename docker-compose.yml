# Solo per lo sviluppo locale: Postgres identico allo schema di Aurora. Le
# foto restano su disco (vedi adapters/filesystem.py), non servono qui.
services:
  postgres:
    image: postgres:16-alpine
    container_name: wardrobe-postgres
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe
      POSTGRES_DB: wardrobe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe -d wardrobe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
