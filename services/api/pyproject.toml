[project]
name = "wardrobe-api"
version = "0.6.0"
description = "API di Wardrobe: handlers sottili sopra un domain puro"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    # Il solo trasporto verso Supabase: PostgREST e Storage, sempre con il
    # token dell'utente (ADR 0010). Anche i provider LLM non di riferimento.
    "httpx>=0.28",
    # Anthropic è il provider di riferimento e ha l'SDK ufficiale: retry,
    # errori tipizzati e structured output li gestisce lui. Gli altri provider
    # sono adapter HTTP sottili, perché servono al confronto nel playground.
    "anthropic>=0.75",
    # Solo per `local_server.py`: un file .env è più facile da spiegare a chi
    # non ha mai usato un terminale di una variabile d'ambiente di sistema.
    "python-dotenv>=1.0",
    # La verifica dei token di Supabase (domain/accesso.py): ES256, quindi con
    # `cryptography`. Il login non lo fa più il backend, lo fa Supabase Auth.
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    # Solo per gli script (`scripts/verifica_database.py`, la migrazione dei
    # dati dal VPS): il backend non ha nessuna credenziale del database.
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# La struttura è quella richiesta: tre pacchetti top-level dentro src/.
# handlers dipende da domain; domain non dipende da nessuno dei due altri.
packages = ["src/domain", "src/handlers", "src/adapters"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# Niente --cov qui: `npm run api:test` deve restare il ciclo veloce. La coverage
# si chiede esplicitamente, con `npm run api:cov`.
addopts = "-q"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
# La soglia non è un obiettivo: è un cricchetto. Si alza nella stessa modifica
# che alza la coverage vera, e non si abbassa mai — abbassarla è una voce in
# docs/QUESTIONI.md, non un commit.
#
# 85 perché il rilevato del 2026-09-27 è 86% (fase 2 di ADR 0010: via il CRUD,
# dentro l'adapter Supabase con i suoi test), meno un punto per non far cadere
# una PR che cancella un file ben coperto. Prima era 73, sul 74% del 2026-09-09.
#
# Da sola questa soglia è debole: 86% è la media fra domain/ al 99% e
# adapters/ al 70%, quindi il dominio potrebbe scendere all'80% mentre un
# provider HTTP compensa. Le due soglie che contano davvero sono in
# .github/workflows/api.yml, applicate per sottoalbero sullo stesso .coverage.
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "TID"]
ignore = [
    "RUF001", # i nomi di dominio sono in italiano: gli accenti sono voluti
    "RUF002",
    "RUF003",
    "N818",   # le eccezioni si chiamano ErroreX, non XError: dominio in italiano
    "A003",   # `id` è un nome di campo legittimo nei modelli Pydantic
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Il vincolo architetturale reso eseguibile: se un import di psycopg finisce
# in domain/, il lint fallisce. Vedi la regola per-file qui sotto.
"psycopg".msg = "psycopg solo in adapters/ — il domain resta puro"
"httpx".msg = "httpx solo in adapters/ — il domain resta puro"

[tool.ruff.lint.per-file-ignores]
"src/adapters/**" = ["TID251"]
"tests/**" = ["TID251"]
"scripts/**" = ["TID251", "A"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
