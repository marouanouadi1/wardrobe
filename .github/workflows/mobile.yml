name: mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checks:
    name: typecheck + lint + export web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # I tipi in packages/contracts sono generati dal backend: se il campo
      # `materiale` cambia lì, questo tsc fallisce. È il punto in cui il
      # disallineamento frontend/backend diventa visibile.
      - name: Typecheck
        run: npm run typecheck --workspace @wardrobe/mobile

      - name: Lint
        run: npm run lint --workspace @wardrobe/mobile

      # L'export web è il controllo di build più economico che abbiamo:
      # non serve un runner macOS né credenziali EAS.
      - name: Export web
        run: npm run build:web --workspace @wardrobe/mobile

  release:
    name: bump versione + build EAS + pubblica release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      # fetch-depth: 0 non è un lusso: scripts/bump-versione.mjs sceglie il
      # livello leggendo i commit dall'ultimo tag mobile-v*, e col default
      # (profondità 1, nessun tag) non vedrebbe niente — rilasciando sempre un
      # patch senza che nessuno se ne accorga.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Unica fonte di verità: apps/mobile/app.json (expo.version). Il livello
      # (major/minor/patch) non è fisso: lo script lo deduce dai conventional
      # commit dall'ultimo tag mobile-v*, contando solo quelli che toccano
      # apps/mobile e packages/contracts — una feature solo backend non alza il
      # minor dell'app. Vedi docs/adr/0005.
      #
      # Il commit generato qui ha [skip ci] nel messaggio apposta: tocca
      # apps/mobile/**, che rientra nei path che fanno partire questo stesso
      # workflow — senza [skip ci] il push sotto si rimetterebbe in coda da solo.
      - name: Bump versione app
        id: bump
        run: |
          NEW_VERSION=$(node scripts/bump-versione.mjs mobile)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # package-lock.json registra anche la versione dei workspace, e il bump da
      # solo lo lascia indietro: prima di questo passo il lock diceva 0.1.4 con
      # app.json già a 0.1.5. `npm ci` non protesta, ma è un altro numero che
      # mente. Su un bump di sola versione cambia esattamente quelle righe.
      - name: Riallinea package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit + tag + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json apps/mobile/package.json package-lock.json
          git commit -m "chore(mobile): bump versione a ${{ steps.bump.outputs.version }} [skip ci]"
          # Fino a ieri su main pushava un job solo; ora sono due (questo
          # e il job deploy di api.yml), e un merge che tocca i
          # path di entrambi li fa partire insieme: il secondo ad arrivare
          # trova main avanti di un commit e senza rebase il push verrebbe
          # rifiutato. I due job toccano file disgiunti, quindi il rebase non
          # ha conflitti da risolvere.
          #
          # Il tag si crea dopo il push, non prima: un rebase riscrive il
          # commit, e un tag creato prima resterebbe appeso a un commit che su
          # main non esiste.
          pushato=no
          for tentativo in 1 2 3; do
            if git push origin HEAD:main; then pushato=si; break; fi
            echo "main è andato avanti, rebase e riprovo ($tentativo/3)"
            git pull --rebase origin main
          done
          # Senza questo controllo il `for` uscirebbe con lo stato dell'ultimo
          # comando (il rebase, che riesce) e lo step passerebbe senza aver
          # pushato niente.
          if [ "$pushato" != si ]; then
            echo "::error::Il bump non è arrivato su main dopo 3 tentativi"
            exit 1
          fi
          git tag "mobile-v${{ steps.bump.outputs.version }}"
          # --follow-tags non spinge tag lightweight come questo (serve un tag
          # annotato, -a): push esplicito, non implicito.
          git push origin "mobile-v${{ steps.bump.outputs.version }}"

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --wait fa fallire lo step (e quindi l'intero job, senza pubblicare
      # nessuna release) se la build EAS va in errore. --json implica
      # --non-interactive.
      - name: Build Android preview
        id: eas
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > /tmp/eas-build.json
          cat /tmp/eas-build.json
          BUILD_URL=$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end' /tmp/eas-build.json)
          echo "apk_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Scarica APK
        run: curl -L -o wardrobe.apk "${{ steps.eas.outputs.apk_url }}"

      - name: Pubblica GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mobile-v${{ steps.bump.outputs.version }}" wardrobe.apk \
            --title "Wardrobe mobile v${{ steps.bump.outputs.version }}" \
            --notes "Build automatica da main (${{ github.sha }})."
