name: api

# Filtro sui path: un commit che tocca solo l'app non deve far girare
# lint/test/package del backend. Vale per tutti e tre i workflow — è la ragione
# per cui questo monorepo non ha bisogno di Nx o Turborepo.
on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/api

jobs:
  quality:
    name: lint + type + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installa uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: uv sync --all-extras --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      # Il domain è puro: pytest gira senza AWS, senza container, senza mock
      # della SDK. Se un test qui ha bisogno di credenziali, la separazione
      # handlers/domain è stata violata.
      - name: Pytest
        run: uv run pytest --cov=src --cov-report=term-missing

  contracts:
    name: contratti allineati
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: uv sync --all-extras --frozen

      - name: Installa dipendenze Node
        run: npm ci
        working-directory: .

      # I modelli Pydantic in src/domain sono la fonte di verità. Questo step
      # rigenera JSON Schema e tipi TypeScript e fallisce se il committato è
      # vecchio: rinominare un campo nel backend rompe qui, non in produzione.
      - name: Rigenera e confronta
        run: npm run contracts:check
        working-directory: .

  package:
    name: pacchetto Lambda
    runs-on: ubuntu-latest
    needs: [quality, contracts]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Costruisci lo zip
        run: ./scripts/build_lambda.sh

      - uses: actions/upload-artifact@v5
        with:
          name: lambda-bundle
          path: services/api/build/lambda.zip
          retention-days: 7
          if-no-files-found: error
