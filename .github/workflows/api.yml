name: api

# Filtro sui path: un commit che tocca solo l'app non deve far girare
# lint/test del backend. Vale anche per l'altro workflow — è la ragione per
# cui questo monorepo non ha bisogno di Nx o Turborepo.
on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/api

jobs:
  quality:
    name: lint + type + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installa uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      # Il domain è puro: pytest gira senza rete, senza container, senza mock
      # della SDK. Se un test qui ha bisogno di credenziali, la separazione
      # handlers/domain è stata violata.
      - name: Pytest
        run: uv run pytest --cov=src --cov-report=term-missing

  contracts:
    name: contratti allineati
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: uv sync --frozen

      - name: Installa dipendenze Node
        run: npm ci
        working-directory: .

      # I modelli Pydantic in src/domain sono la fonte di verità. Questo step
      # rigenera JSON Schema e tipi TypeScript e fallisce se il committato è
      # vecchio: rinominare un campo nel backend rompe qui, non in produzione.
      - name: Rigenera e confronta
        run: npm run contracts:check
        working-directory: .

  deploy:
    name: deploy su VPS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [quality, contracts]
    steps:
      - uses: actions/checkout@v5

      # Chiave dedicata al deploy da CI (non quella personale usata da
      # terminale): vedi docs/deploy.md per come è stata generata e installata
      # sul server.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # .github/deploy/known_hosts è committato (non è un segreto: è la
      # chiave pubblica dell'host) così la CI non si fida "al buio" del
      # server a ogni run.
      - name: Fidati dell'host VPS
        run: |
          mkdir -p ~/.ssh
          cat .github/deploy/known_hosts >> ~/.ssh/known_hosts
        working-directory: .

      # Stesso identico comando documentato in docs/deploy.md per il deploy a
      # mano: stesse esclusioni, .env compresi — i due .env sul server restano
      # scritti a mano, mai toccati da qui.
      - name: Rsync codice sul VPS
        run: |
          rsync -avz --exclude node_modules --exclude .venv --exclude .git --exclude .env \
            -e ssh ./ marouan@89.167.15.22:~/wardrobe/
        working-directory: .

      - name: Rebuild + riavvio container
        run: ssh marouan@89.167.15.22 'cd ~/wardrobe && docker compose up -d --build'
        working-directory: .

      - name: Verifica salute
        run: |
          sleep 5
          curl --fail https://api.ilmioarmadio.xyz/salute
        working-directory: .
