name: api

# Filtro sui path: un commit che tocca solo l'app non deve far girare
# lint/test del backend. Vale anche per l'altro workflow — è la ragione per
# cui questo monorepo non ha bisogno di Nx o Turborepo.
on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

# Serve al job `deploy`, che pusha il commit di bump e il tag api-v*.
permissions:
  contents: write

defaults:
  run:
    working-directory: services/api

jobs:
  quality:
    name: lint + type + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installa uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      # Il domain è puro: pytest gira senza rete, senza container, senza mock
      # della SDK. Se un test qui ha bisogno di credenziali, la separazione
      # handlers/domain è stata violata.
      - name: Pytest
        run: uv run pytest --cov=src --cov-report=term-missing

  contracts:
    name: contratti allineati
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: uv sync --frozen

      - name: Installa dipendenze Node
        run: npm ci
        working-directory: .

      # I modelli Pydantic in src/domain sono la fonte di verità. Questo step
      # rigenera JSON Schema e tipi TypeScript e fallisce se il committato è
      # vecchio: rinominare un campo nel backend rompe qui, non in produzione.
      - name: Rigenera e confronta
        run: npm run contracts:check
        working-directory: .

  deploy:
    name: bump versione + deploy su VPS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [quality, contracts]
    steps:
      # fetch-depth: 0 perché lo script di bump sceglie il livello leggendo i
      # commit dall'ultimo tag api-v*: col default (profondità 1, nessun tag)
      # non vedrebbe niente.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node serve solo per lo script di bump, condiviso con il workflow
      # mobile: la logica dei conventional commit sta scritta in un posto solo.
      # Niente `cache: npm`: qui non si installa nulla, lo script di bump usa
      # solo moduli built-in di Node.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # uv serve solo per rifare il lock dopo il bump (sotto).
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      # Unica fonte di verità: la `version` di services/api/pyproject.toml. Da
      # lì finisce nei metadati del pacchetto installato dal Dockerfile, ed è
      # quella che GET /salute riporta — vedi lo step di verifica in fondo.
      #
      # Qui i file vengono solo *scritti*: il commit e il tag arrivano in
      # fondo, a deploy verificato. Un tag api-v0.2.0 su una versione che non è
      # mai andata in produzione sarebbe una bugia scritta nella storia.
      - name: Bump versione api
        id: bump
        run: |
          NUOVA=$(node scripts/bump-versione.mjs api)
          echo "version=$NUOVA" >> "$GITHUB_OUTPUT"
        working-directory: .

      # uv.lock registra anche la versione del progetto stesso: senza questo
      # resterebbe indietro per sempre, ed è esattamente il tipo di numero che
      # mente che questo giro doveva togliere. `uv lock` dopo un bump di sola
      # versione cambia quella riga e nient'altro — non è un aggiornamento
      # delle dipendenze mascherato dentro un commit di rilascio.
      - name: Riallinea uv.lock
        run: uv lock

      # Chiave dedicata al deploy da CI (non quella personale usata da
      # terminale): vedi docs/deploy.md per come è stata generata e installata
      # sul server.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # .github/deploy/known_hosts è committato (non è un segreto: è la
      # chiave pubblica dell'host) così la CI non si fida "al buio" del
      # server a ogni run.
      - name: Fidati dell'host VPS
        run: |
          mkdir -p ~/.ssh
          cat .github/deploy/known_hosts >> ~/.ssh/known_hosts
        working-directory: .

      # Stesso identico comando documentato in docs/deploy.md per il deploy a
      # mano: stesse esclusioni, .env compresi — i due .env sul server restano
      # scritti a mano, mai toccati da qui.
      - name: Rsync codice sul VPS
        run: |
          rsync -avz --exclude node_modules --exclude .venv --exclude .git --exclude .env \
            -e ssh ./ marouan@89.167.15.22:~/wardrobe/
        working-directory: .

      - name: Rebuild + riavvio container
        run: ssh marouan@89.167.15.22 'cd ~/wardrobe && docker compose up -d --build'
        working-directory: .

      # Idempotente (ogni file è "create ... if not exists", vedi
      # scripts/applica_migrazioni.py): girare ad ogni deploy, anche quando
      # non c'è una migrazione nuova, non fa danni. `-T` disattiva la
      # pseudo-tty, che altrimenti fallirebbe in un contesto non interattivo
      # come questo.
      - name: Applica migrazioni
        run: ssh marouan@89.167.15.22 'cd ~/wardrobe && docker compose exec -T api python scripts/applica_migrazioni.py'
        working-directory: .

      # Non più solo "risponde": GET /salute riporta la versione dai metadati
      # del pacchetto, quindi qui si verifica che il container ricostruito stia
      # servendo *questo* rilascio. Prima di questo confronto un rsync andato a
      # metà, o un `docker compose up` che riusava l'immagine vecchia, passavano
      # inosservati: l'endpoint rispondeva comunque.
      - name: Verifica salute e versione servita
        env:
          ATTESA: ${{ steps.bump.outputs.version }}
        run: |
          set -o pipefail
          sleep 5
          SERVITA=$(curl --fail --silent https://api.ilmioarmadio.xyz/salute | jq -r .versione)
          echo "/salute riporta: $SERVITA (atteso: $ATTESA)"
          if [ "$SERVITA" != "$ATTESA" ]; then
            echo "::error::Il VPS serve la versione $SERVITA, non la $ATTESA appena rilasciata"
            exit 1
          fi
        working-directory: .

      # In fondo, non in cima: se qualcosa sopra è andato storto il rilascio non
      # lascia traccia su main e il prossimo tentativo riparte dallo stesso
      # numero. [skip ci] perché il commit tocca services/api/**, che è nei path
      # che fanno partire questo stesso workflow.
      - name: Commit + tag + push della versione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/pyproject.toml services/api/uv.lock
          git commit -m "chore(api): bump versione a ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "api-v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          # Tag lightweight (git tag senza -a): --follow-tags non lo pubblica,
          # serve un push esplicito. Stessa nota in mobile.yml.
          git push origin "api-v${{ steps.bump.outputs.version }}"
        working-directory: .
